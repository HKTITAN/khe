<script>
  // Before first paint: mark that JavaScript runs (the agent text below is for crawlers that run none)
  // and apply the saved theme, so neither flashes.
  (function () {
    var d = document.documentElement
    d.classList.add("js")
    try {
      var q = new URLSearchParams(location.search).get("theme")
      var t = q === "dark" || q === "light" ? q : localStorage.getItem("khe-theme")
      if (t === "dark" || t === "light") d.setAttribute("data-theme", t)
    } catch (e) {}
  })()
</script>
